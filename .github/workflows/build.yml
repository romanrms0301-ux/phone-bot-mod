name: Build
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            platform: android64
    runs-on: ubuntu-latest
    name: ${{ matrix.config.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.config.platform }}
          combine: false
